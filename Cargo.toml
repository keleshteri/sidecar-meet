[workspace]
members = ["crates/core", "crates/api", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/api"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sidecar-core = { path = "crates/core" }

[profile.dev]
debug = 0
